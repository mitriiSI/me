<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151d">
  <meta name="description" content="Схемы метро России, маршруты и звуковые подсказки о пересадках и прибытии.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Метросигнал">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./style.css?v=6">
  <title>Метросигнал — маршрут по метро</title>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true">
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 10.5-8 10.5S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M8 19V5m-4 4 4-4 4 4m4-4v14m-4-4 4 4 4-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3M4 14v3a2 2 0 0 0 2 2h2v-7H6a2 2 0 0 0-2 2Zm16 0v3a2 2 0 0 1-2 2h-2v-7h2a2 2 0 0 1 2 2Z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zm12 .5a4 4 0 0 1 0 5m2.5-7a7 7 0 0 1 0 9"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H17a3 3 0 0 1 0 6H7a3 3 0 0 0 0 6h8.5"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Zm6-3v15m6-12v15"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-train" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="15" rx="4"/><path d="M5 11h14M9 18l-2 3m8-3 2 3M9 15h.01M15 15h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4.5 4.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 16v4h16v-4"/></symbol>
    <symbol id="i-navigation" viewBox="0 0 24 24"><path d="m19.5 4.5-5.2 15-3.2-6.6-6.6-3.2z"/></symbol>
  </svg>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="city-button" class="city-button" type="button" aria-haspopup="dialog">
        <svg class="icon"><use href="#i-pin"/></svg><span id="city-label">Москва</span><svg class="icon chevron"><use href="#i-chevron"/></svg>
      </button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <section class="planner" aria-labelledby="plan-title">
      <div class="trip-stack">
        <section class="panel plan-card" aria-labelledby="plan-title">
          <div class="card-heading">
            <h1 id="plan-title">План поездки</h1>
            <button id="swap-button" class="icon-button" title="Развернуть маршрут" aria-label="Развернуть маршрут" type="button"><svg class="icon"><use href="#i-swap"/></svg></button>
          </div>
          <div id="route-fields" class="route-fields"></div>
          <button id="add-via" class="via-button" type="button"><svg class="icon"><use href="#i-plus"/></svg>Через станцию</button>
          <p id="route-error" class="inline-error" role="status" hidden></p>
        </section>

        <section class="panel summary-card" id="summary-card" aria-labelledby="summary-title" hidden>
          <div class="summary-heading">
            <span class="summary-icon"><svg class="icon"><use href="#i-train"/></svg></span>
            <div><h2 id="summary-title"></h2><p id="summary-stats"></p></div>
            <button id="details-button" class="icon-button" aria-label="Все станции маршрута" aria-expanded="false" type="button"><svg class="icon"><use href="#i-chevron"/></svg></button>
          </div>
          <div id="route-preview"></div>
          <div id="route-details" hidden></div>
          <button id="start-trip" class="primary full" type="button"><svg class="icon"><use href="#i-headphones"/></svg>Начать поездку</button>
          <p class="start-hint" id="start-hint">Нажми, когда поезд тронется.</p>
        </section>

        <section class="panel ride-card" id="ride-card" aria-label="Текущая поездка" hidden></section>

        <button class="sound-card" id="sound-button" type="button" aria-haspopup="dialog">
          <span class="sound-icon"><svg class="icon"><use href="#i-sound"/></svg></span>
          <span><strong>Звуковые сигналы</strong><small id="sound-caption">Пересадки и прибытие</small></span>
          <svg class="icon sound-chevron"><use href="#i-chevron"/></svg>
        </button>
      </div>
    </section>

    <div class="map-home" id="map-home">
    <section class="map-card panel" id="map-section" aria-labelledby="map-title">
      <div class="map-heading">
        <div class="map-title-group">
          <span class="map-heading-icon"><svg class="icon"><use href="#i-map"/></svg></span>
          <div><h2 id="map-title">Схема метро</h2><p id="map-subtitle">Москва</p></div>
        </div>
        <div class="map-heading-actions">
          <button type="button" class="map-mode" id="map-mode"><svg class="icon"><use href="#i-route"/></svg><span id="map-mode-label">Мой маршрут</span></button>
          <button type="button" class="map-lines icon-button" id="lines-button" aria-label="Все линии" title="Все линии" aria-haspopup="dialog"><svg class="icon"><use href="#i-list"/></svg></button>
          <button type="button" class="map-expand" id="map-expand" aria-label="Развернуть схему" aria-haspopup="dialog"><svg class="icon"><use href="#i-fit"/></svg><span>Развернуть</span></button>
        </div>
      </div>
      <div class="map-stage" id="map-stage" aria-label="Интерактивная схема метро">
        <canvas id="metro-map" aria-label="Схема линий метро. Для изменения масштаба сведи или разведи два пальца."></canvas>
        <span class="map-compass" aria-hidden="true"><svg class="icon"><use href="#i-navigation"/></svg><span>С</span></span>
        <div class="map-tools" aria-label="Управление схемой">
          <div class="map-zoom">
            <button id="zoom-in" aria-label="Приблизить" title="Приблизить" type="button"><svg class="icon"><use href="#i-plus"/></svg></button>
            <button id="zoom-out" aria-label="Отдалить" title="Отдалить" type="button"><svg class="icon"><use href="#i-minus"/></svg></button>
          </div>
          <button id="fit-map" aria-label="Вся схема" title="Вся схема" type="button"><svg class="icon"><use href="#i-fit"/></svg></button>
          <button id="locate-map" aria-label="Моё местоположение" title="Моё местоположение" type="button"><svg class="icon"><use href="#i-locate"/></svg></button>
        </div>
        <p id="map-message" class="map-message" role="status" hidden></p>
      </div>
    </section>
    </div>
  </main>
  <dialog id="map-dialog" aria-labelledby="map-title"></dialog>

  <dialog id="modal" aria-labelledby="modal-title">
    <div class="modal-inner">
      <div class="modal-heading"><h2 id="modal-title"></h2><button class="icon-button" id="modal-close" aria-label="Закрыть" type="button"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <div id="modal-content"></div>
    </div>
  </dialog>
  <noscript>Для построения маршрута включите JavaScript в браузере.</noscript>
  <script type="module" src="./app.mjs?v=6"></script>
</body>
</html>
